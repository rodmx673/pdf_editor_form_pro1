<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor Visual - Capa Independiente</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #333; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        .sidebar { position: fixed; top: 0; left: 0; width: 350px; height: 100vh; background: #fff; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.3); overflow-y: auto; z-index: 1000; box-sizing: border-box; }
        .sidebar h2 { margin-top: 0; font-size: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: #0071e3; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .canvas-area { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .preview-canvas { width: 100%; height: 100%; background: rgba(0,0,0,0.8); position: absolute; top: 0; left: 0; overflow: hidden; }
        .preview-canvas::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(255,255,255,0.2); pointer-events: none; z-index: 0; }
        .preview-canvas::after { content: ''; position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(255,255,255,0.2); pointer-events: none; z-index: 0; }
        .draggable-block { position: absolute; cursor: move; border: 2px dashed #0071e3; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: white; overflow: hidden; user-select: none; }
        .draggable-block.selected { border: 2px solid #ff6b00; z-index: 100; }
        .draggable-block img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .draggable-block iframe { width: 100%; height: 100%; pointer-events: none; }
        .draggable-block .text-content { padding: 10px; text-align: center; font-size: 16px; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .resize-handle { position: absolute; right: 0; bottom: 0; width: 15px; height: 15px; background: #ff6b00; cursor: se-resize; }
    </style>
</head>
<body>
    <div id="admin-login-screen" style="position:fixed; inset:0; background:#1d1d1f; z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif;">
        <h2 style="margin-bottom:20px;">🔒 Acceso Restringido</h2>
        <input type="password" id="admin-pass" placeholder="Contraseña" style="padding:12px; border-radius:8px; border:none; font-size:16px; text-align:center; margin-bottom:15px; width:200px;">
        <button onclick="checkAdminPass()" style="padding:12px 30px; border-radius:8px; border:none; background:#0071e3; color:white; font-weight:bold; cursor:pointer;">Entrar</button>
    </div>

    <div class="sidebar">
        <h2>🎛️ Editor Visual</h2>
        <p style="font-size: 12px; color: #d9534f; font-weight: bold;">⚠️ No coloques bloques debajo de este menú.</p>
        <button class="btn-primary" onclick="addBlock('text')">+ Añadir Texto</button>
        <button class="btn-primary" onclick="addBlock('youtube')">+ Añadir YouTube</button>
        <button class="btn-primary" onclick="addBlock('banner')">+ Añadir Banner/Imagen</button>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
        <div id="properties-panel"><p style="text-align: center; color: #999; font-size: 14px;">Selecciona un bloque para editar.</p></div>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
        <button class="btn-success" onclick="saveConfig(true)">💾 Guardar y Probar</button>
        <button onclick="saveConfig(false)" style="background:#eee;">Solo Guardar</button>
        <button class="btn-danger" onclick="clearAll()">🗑️ Borrar Todo</button>
    </div>
    <div class="canvas-area"><div class="preview-canvas" id="canvas"></div></div>

        <script>
        function checkAdminPass() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'PdfAdm1n_8f3a2b9c1d4e5f6g!') { 
                sessionStorage.setItem('admin_token', pass);
                document.getElementById('admin-login-screen').style.display = 'none'; 
                loadConfig(); 
            } else { 
                alert('Contraseña incorrecta'); 
            }
        }
        
        // Autologin si ya se autenticó en esta sesión
        if (sessionStorage.getItem('admin_token') === 'PdfAdm1n_8f3a2b9c1d4e5f6g!') {
            document.getElementById('admin-login-screen').style.display = 'none';
            // loadConfig se llama automáticamente al final del script
        }
    </script>
</body>
</html>
