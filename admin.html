<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor Visual - Capa Independiente</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="admin-login-screen" style="position:fixed; inset:0; background:#1d1d1f; z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif;">
        <h2 style="margin-bottom:20px;">🔒 Acceso Restringido</h2>
        <input type="password" id="admin-pass" placeholder="Contraseña" style="padding:12px; border-radius:8px; border:none; font-size:16px; text-align:center; margin-bottom:15px; width:250px;">
        <button onclick="checkAdminPass()" style="padding:12px 30px; border-radius:8px; border:none; background:#0071e3; color:white; font-weight:bold; cursor:pointer; width:250px;">Entrar</button>
    </div>

    <div class="sidebar">
        <h2>🎛️ Editor Visual</h2>
        
        <div style="background: #f0f8ff; padding: 10px; border-radius: 8px; border: 1px solid #0071e3; margin-bottom: 15px;">
            <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin: 0;">
                <span style="font-weight: bold; color: #0071e3;">Capa Activa (Global)</span>
                <input type="checkbox" id="layer-active-toggle" style="width: 20px; height: 20px; margin: 0;" onchange="toggleLayerActive()">
            </label>
        </div>

        <div style="background: #f5f5f5; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px;">
            <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin: 0;">
                <span style="font-weight: bold; color: #333;">Fondo Transparente</span>
                <input type="checkbox" id="bg-toggle" style="width: 20px; height: 20px; margin: 0;" onchange="toggleBackground()">
            </label>
        </div>

        <button class="btn-primary" onclick="addBlock('text')">+ Añadir Texto</button>
        <button class="btn-primary" onclick="addBlock('youtube')">+ Añadir YouTube</button>
        <button class="btn-primary" onclick="addBlock('banner')">+ Añadir Banner/Imagen</button>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
        <div id="properties-panel"><p style="text-align: center; color: #999; font-size: 14px;">Selecciona un bloque para editar.</p></div>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
        <button class="btn-success" onclick="saveConfig(true)">💾 Guardar y Probar</button>
        <button onclick="saveConfig(false)" style="background:#eee;">Solo Guardar</button>
        <button class="btn-danger" onclick="clearAll()">🗑️ Borrar Todo</button>
    </div>
    
    <div class="canvas-area"><div class="preview-canvas dark-bg" id="canvas"></div></div>
    
    <!-- Aquí cargamos toda la lógica -->
    <script src="admin.js"></script>
</body>
</html>
